<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/MyTripper/_common/header_footer_style.css" />
    <script src="/MyTripper/_common/header_footer_script.js"></script>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
        crossorigin="anonymous"
    />
    <script src="https://cdn.supabase.com/supabase-js-v2.min.js"></script>
</head>
<body>
    <div class="container">
        <nav id="header"></nav>
        <div id="main-sector">
            <h1>비밀번호 재설정</h1>
            <form id="find-password-form">
                <input type="text" id="user_id_find" placeholder="아이디" required>
                <input type="text" id="mbti_find" placeholder="MBTI" required>
                <button type="submit">본인 확인</button>
            </form>

            <div id="password-reset-form" style="display: none; margin-top: 20px;">
                <h2>새 비밀번호 설정</h2>
                <form id="set-password-form">
                    <input type="password" id="new_password" placeholder="새 비밀번호" required>
                    <button type="submit">비밀번호 재설정</button>
                </form>
            </div>

            <div id="message-display" style="margin-top: 20px;">
            </div>
            <p><a href="login.html">로그인 페이지로 돌아가기</a></p>

            <script src="find_password.js"></script>
        </div>
        <footer id="footer"></footer>
        </div>

    <script>
        // Bootstrap JS (Optional, for certain components like dropdowns)
        src =
            "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js";
        integrity =
            "sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN";
        crossorigin = "anonymous";

    </script>
</body>
</html>
