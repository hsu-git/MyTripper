<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>후기 게시판</title>

    <link rel="stylesheet" href="../_common/header_footer_style.css" />
    <script src="../_common/header_footer_script.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <nav id="header"></nav>
      <div class="container review-container">
        <div class="row">
          <div class="col-md-8 offset-md-2">
            <div class="mt-4">
              <h4 class="mb-3">댓글</h4>
              <div class="mt-3 comment-form">
                <textarea
                  placeholder="댓글을 작성하세요"
                  rows="4"
                  id="comment-area"
                  class="w-100 px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-gray-200"
                ></textarea>
                <button
                  class="mt-2 py-2 px-4 bg-black text-white rounded hover:bg-gray-800 transition-colors"
                  onclick="SetComment()"
                >
                  Submit
                </button>
              </div>
            </div>
            <div id="comments-container"></div>
          </div>
        </div>
      </div>
      <footer id="footer"></footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="java.js"></script>
  </body>
</html>
