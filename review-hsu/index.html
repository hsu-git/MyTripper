<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>후기 게시글 페이지 (index.html)</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 커스텀 CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 헤더가 표시될 공간 -->
    <div id="header"></div>

    <hr />
    <div class="container mt-4">
      <!-- (A) 캐러셀 (생략 가능) -->
      <section class="container my-5">
        <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
          <!-- 캐러셀 인디케이터 -->
          <div class="carousel-indicators">
            <button
              type="button"
              data-bs-target="#travelCarousel"
              data-bs-slide-to="0"
              class="active"
              aria-current="true"
              aria-label="Slide 1"
            ></button>
            <button
              type="button"
              data-bs-target="#travelCarousel"
              data-bs-slide-to="1"
              aria-label="Slide 2"
            ></button>
            <button
              type="button"
              data-bs-target="#travelCarousel"
              data-bs-slide-to="2"
              aria-label="Slide 3"
            ></button>
          </div>

          <!-- 캐러셀 아이템들 -->
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img
                src="https://picsum.photos/id/1015/1200/400"
                class="d-block w-100"
                alt="carousel-1"
              />
              <div class="carousel-caption d-none d-md-block">
                <h5>추천 여행지 #1</h5>
                <p>MBTI 기반 여행 추천</p>
              </div>
            </div>
            <div class="carousel-item">
              <img
                src="https://picsum.photos/id/1002/1200/400"
                class="d-block w-100"
                alt="carousel-2"
              />
              <div class="carousel-caption d-none d-md-block">
                <h5>추천 여행지 #2</h5>
                <p>자유롭게 떠나볼까?</p>
              </div>
            </div>
            <div class="carousel-item">
              <img
                src="https://picsum.photos/id/1011/1200/400"
                class="d-block w-100"
                alt="carousel-3"
              />
              <div class="carousel-caption d-none d-md-block">
                <h5>추천 여행지 #3</h5>
                <p>가족, 친구와 함께</p>
              </div>
            </div>
          </div>

          <!-- 이전/다음 버튼 -->
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#travelCarousel"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">이전</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#travelCarousel"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">다음</span>
          </button>
        </div>
      </section>
      <!-- (B) 검색/필터 영역 -->
      <main>
        <div class="container my-4">
          <!-- 
            row + col-auto (MBTI) + col (검색초기화버튼+검색창) 
            - MBTI 왼쪽 
            - 검색초기화 + 검색창 오른쪽 정렬
          -->
          <div class="row align-items-center">
            <!-- (1) 왼쪽: MBTI 드롭다운 -->
            <div class="col-auto">
              <div class="input-group input-group-sm" style="max-width: 200px">
                <label class="input-group-text" for="mbtiSelect">MBTI</label>
                <select class="form-select" id="mbtiSelect">
                  <option selected>MBTI별 게시글</option>
                  <option value="ISTJ">ISTJ</option>
                  <option value="ISFJ">ISFJ</option>
                  <option value="INFJ">INFJ</option>
                  <option value="INTJ">INTJ</option>
                  <option value="ISTP">ISTP</option>
                  <option value="ISFP">ISFP</option>
                  <option value="INFP">INFP</option>
                  <option value="INTP">INTP</option>
                  <option value="ESTP">ESTP</option>
                  <option value="ESFP">ESFP</option>
                  <option value="ENFP">ENFP</option>
                  <option value="ENTP">ENTP</option>
                  <option value="ESTJ">ESTJ</option>
                  <option value="ESFJ">ESFJ</option>
                  <option value="ENFJ">ENFJ</option>
                  <option value="ENTJ">ENTJ</option>
                </select>
              </div>
            </div>

            <!-- (2) 오른쪽: 검색 초기화 버튼 + 검색창 -->
            <div class="col text-end">
              <!-- 검색 초기화 버튼 (왼쪽) -->
              <button
                class="btn btn-outline-secondary btn-sm me-2"
                id="btnSearchReset"
                style="display: none"
              >
                검색 초기화
              </button>

              <!-- 검색창 (오른쪽) -->
              <div class="input-group d-inline-flex" style="max-width: 300px">
                <input
                  type="text"
                  class="form-control"
                  placeholder="검색어를 입력하세요"
                  id="textSearchInput"
                />
                <button class="btn btn-secondary" id="btnSearchText">
                  검색
                </button>
              </div>
            </div>
          </div>

          <!-- (C) 검색 배지 표시 영역 -->
          <div id="searchBadges" class="mt-2"></div>

          <hr />

          <!-- (D) 게시글 목록 표시 영역 -->
          <div class="mt-4" id="board-list"></div>

          <hr />
          <!-- 페이지네이션 -->
          <nav class="mt-4 text-center" aria-label="Page navigation example">
            <ul class="pagination justify-content-center" id="pagination"></ul>
          </nav>
        </div>
      </main>
    </div>
    <footer id="footer"></footer>
    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>

    <!-- JS -->
    <script src="javascript_express.js" defer></script>

    <!-- header/footer 로딩 스크립트 (직접 작성) -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // (1) 헤더 불러오기
        fetch("/common/header.html")
          .then((res) => res.text())
          .then((html) => {
            document.getElementById("header").innerHTML = html;
          });

        // (2) 푸터 불러오기
        fetch("/common/footer.html")
          .then((res) => res.text())
          .then((html) => {
            document.getElementById("footer").innerHTML = html;
          });
      });
    </script>
  </body>
</html>
