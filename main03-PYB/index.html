<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>My Webcrumbs Plugin</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../_common/header_footer_style.css" />
    <script src="../_common/header_footer_script.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <nav id="header"></nav>
      <main>
        <div class="mainTitle">
          <h1>추천 장소</h1>
        </div>
        <section class="subTitle">
          <h2>상세 정보</h2>
          <div class="contentText">
            <div class="text-area">
              <div class="region">
                <p>지역 정보: [지역명]</p>
              </div>
            </div>
            <div class="image-area">
              <img src="image.jpg" alt="배경 이미지 - 추천 장소 풍경" />
            </div>
          </div>
        </section>
        <button id="save-button">저장하기</button>
        <section class="search-area">
          <h2>추가적인 정보를 알고싶으신가요?</h2>
          <p>궁금한 부분을 물어봐주세요!</p>
          <p>단, 해당 질문으로 알게 된 내용은 저장되지 않습니다.</p>
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              placeholder="ex)광안리 해수욕장 위치가 어디야?"
            />
            <button id="search-button">추가로 질문하기</button>
          </div>
        </section>
        <div id="search-result"></div>
        <div id="loading" style="display: none">로딩 중...</div>
      </main>
      <footer id="footer"></footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"
    ></script>
    <script src="index.js" type="module"></script>
  </body>
</html>
